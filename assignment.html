<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<style>
body{ 
    background-color: rgb(80, 79, 79); 
    font-family: Arial, sans-serif;
}
form {
    width: 350px;
    margin: 100px auto;
    background-color: white;
    padding: 20px;
    border-radius: 20px;
}
h2 {
    text-align: center;
    color: rgb(247, 92, 15);
}
</style>
   <body>
    <h2> Student Registration </h2>
   </body> 
<form>
<!--Full Name-->
    <label>Full Name</label><br>
    <input type="text" 
           style="width:100%; 
           padding:8px; 
           margin:5px;" required> <br>
<!--Email-->
    <label>Email</label><br>
    <input type="email" 
    style="width: 100%;
    padding: 8px; 
           margin:5px;"required><br>
<!--Phone Number-->
    <label>Phone Number</label><br>
    <input type="tel" 
           style="width:100%; 
           padding:8px; 
           margin:5px;"required><br>
<!-- Password-->
    <label>Password</label><br>
    <input type="password" 
           style="width:100%; 
           padding:8px; 
           margin:5px;" required><br>
<!--Gender-->
    <label>Gender</label><br>
    <input type="radio" name="gender"> Male  <br>
    <input type="radio" name="gender"> Female   
    <br><br>
<!--Button-->
    <input type="submit" value="Register"
           style="width:100%; 
           padding:10px; 
           background-color: rgb(224, 231, 2);
           color: rgb(190, 6, 6);
           border: none;
           font-size: 16px; 
           cursor: pointer;">
        
</form>

</body>
</html>
